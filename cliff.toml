# git-cliff config for drafting a CHANGELOG.md section and picking the next
# version. See https://git-cliff.org/docs/configuration
#
#   git-cliff --bumped-version      # next version from commits since the last v* tag
#   git-cliff --unreleased --bump   # the section to paste into CHANGELOG.md
#
# CHANGELOG.md IS NOT GENERATED FROM THIS. The config only ever drafts; a human
# reads the draft, edits it, and pastes it in. Do not run with `--prepend
# CHANGELOG.md` or `-o CHANGELOG.md`, and do not wire either into a hook or a
# workflow.
#
# Why draft-only, rather than letting cliff own the file from 2.1.0 onward or
# append beneath the existing entries: the 2.0.0 section (462fca9) carries prose
# no generator can produce -- a "Note on the gap since 1.0.0" recording that 1.0.1
# was never released (only a gemspec bump, at ce8b23e, never tagged), so eighteen
# months of work reached users for the first time in a single release. The only
# tags this repo has ever had are v1.0.0 and v2.0.0, locally and on origin --
# check `git tag -l` rather than any prose about it, this one included, because
# three successive passes over that paragraph preserved an earlier claim that
# 1.0.1 HAD been tagged. Ownership or appending puts that paragraph one careless
# flag away from being overwritten, or orphaned above a machine-written section
# that silently contradicts it. Draft-only also suits what this generator
# actually emits (see the `^fix` note below): the draft needs an editor, so the
# design should not pretend otherwise.
#
# The headings below deliberately match what CHANGELOG.md already uses -- `## X.Y.Z
# (YYYY-MM-DD)` and `### Breaking` / `### Added` / `### Fixed` / `### Changed`, not
# the `## [X.Y.Z] - date` of the sibling gems' configs -- so a pasted draft reads
# as part of the same file. The blank line after each heading is there because
# `just fmt-check` runs mdformat over every tracked *.md and wants one, so the
# draft's STRUCTURE pastes in clean. Its prose may not: a multi-paragraph
# BREAKING CHANGE body collapses to one line with doubled spaces at the old
# paragraph breaks, which mdformat rewrites. Run `just fmt` after pasting.
#
# Only changes to the shipped gem count. Tooling, CI, tests, docs and MECHANICAL
# dependency bumps are skipped, so a week of nothing but those yields no commits,
# no section and no version bump. A breaking change is never skipped, whatever its
# type.
#
# `^build` is the exception to that list and is NOT skipped -- see its parser
# below. The word "mechanical" above is carrying the whole distinction: a
# `chore(deps)` bump is Dependabot moving a resolved version and is skipped, while
# a `build(deps)` change is somebody deliberately rewriting a declared requirement
# and is consumer-visible.
#
# What this config still cannot catch, stated so nobody mistakes it for covered:
# a change to a RUNTIME `s.add_dependency` requirement that arrives under a
# skipped type anyway. That is not hypothetical -- 07b9b82, a Dependabot
# `chore(deps)`, widened `thrift` from `< 0.24` to `< 0.25`, which is a change to
# what a consumer's bundler may resolve, and it shipped without a changelog line.
# Of the three commits that have altered a runtime requirement since v1.0.0, two
# were invisible here (94f85c8 `build(deps)`, 07b9b82 `chore(deps)`) and only
# e3a7e93 `fix(spark)` drafted. Un-skipping `^build` closes the first. The second
# is closed by a human step in docs/release-setup.md's "Cutting a release", which
# diffs the gemspec's `add_dependency` lines across the release range. No commit
# type can close it, because the type is chosen by Dependabot.

[changelog]
header = ""
body = """
{%- if commits | length == 0 -%}
{#- An empty range renders nothing. Without this guard a deps-only range still emits a
    bare heading naming the version already published -- precisely the thing somebody
    pastes in by reflex (sequel-hexspace, gator-uem). No commits, no section. -#}
{%- else -%}
{%- if version -%}
## {{ version | trim_start_matches(pat="v") }} ({{ timestamp | date(format="%Y-%m-%d") }})
{% else -%}
## Unreleased
{% endif %}
{%- set breaking = commits | filter(attribute="breaking", value=true) -%}
{% if breaking | length > 0 %}
### Breaking

{% for commit in breaking -%}
- {{ commit.message | split(pat="\\n") | first | upper_first | trim }} ([{{ commit.id | truncate(length=7, end="") }}](https://github.com/outcomesinsights/sequel-hexspace/commit/{{ commit.id }})){% if commit.breaking_description and commit.breaking_description != commit.message %}: {{ commit.breaking_description | replace(from="\n", to=" ") | trim }}{% endif %}
{% endfor %}
{%- endif -%}
{% for group, commits in commits | filter(attribute="breaking", value=false) | group_by(attribute="group") %}
### {{ group }}

{% for commit in commits -%}
- {{ commit.message | split(pat="\\n") | first | upper_first | trim }} ([{{ commit.id | truncate(length=7, end="") }}](https://github.com/outcomesinsights/sequel-hexspace/commit/{{ commit.id }}))
{% endfor %}
{%- endfor %}
{%- endif -%}
"""
footer = ""
trim = true

[git]
conventional_commits = true
# This pair is what keeps the pre-conventional history harmless. Commits before
# v1.0.0 are the original author's plain imperative subjects ("Support VALUES
# inline table statement") with no type, and this repo also merges bead branches
# with --no-ff, giving a "Merge bead sequel-hexspace-xxx: ..." commit per piece of
# work. Both fail conventional parsing and are dropped here, BEFORE any
# commit_parser runs -- measured 2026-10-01: a 14-commit pre-v1.0.0 range and the
# 3 merges in v2.0.0..HEAD all reported "skipped due to parse error" and rendered
# nothing, so the `.*` catch-all below never sees them and an explicit `^Merge`
# skip rule would be dead config. Dropping the merges loses nothing, since cliff
# walks all parents and the branch's own typed commits are already in the range.
#
# Consequence worth stating: this config is only claimed to work for ranges
# starting at v1.0.0 or later. Earlier releases are described by hand in
# CHANGELOG.md and are not regenerable from commit messages.
filter_unconventional = true
filter_commits = true
# Load-bearing, not decoration. A `!` or BREAKING CHANGE commit is kept -- and
# bumps the version -- even when its type is one skipped below, e.g. a `chore!:`
# or a `ci!:` that raises the Ruby floor. (`build!:` was the example here until
# `^build` stopped being skipped; it is now kept by its own parser, so it no
# longer demonstrates anything about this setting.) Measured 2026-10-01 against
# 462fca9 (`feat!: require
# Ruby >= 3.3`) with `^feat` forced into the skip list: true gives v3.0.0, false
# gives "nothing to bump". So without this a breaking change filed under a
# tooling type ships no release at all.
protect_breaking_commits = true
# The only tags here are v1.0.0 and v2.0.0. Anchored at both ends so a tag that
# merely starts with a version (a `v2.0.0-rc1`, were one ever cut) cannot pass for
# a release and move the baseline cliff measures the next version from.
#
# KEEP THE `$`. This repo anchored it first; gator's canon was unanchored until it
# adopted this anchor in gator-2x6 (2026-10-04), and now matches. Should canon and
# this line ever differ again, a "sync with canon" that drops the `$` is a
# weakening, not a sync -- fix canon, not this.
tag_pattern = "^v[0-9]+\\.[0-9]+\\.[0-9]+$"
topo_order = false
sort_commits = "newest"

# First match wins.
commit_parsers = [
  # Not part of the shipped gem: no changelog entry, no release. `^chore` is
  # what covers Dependabot's `chore(deps):` and `chore(deps-dev):`, and so what
  # keeps a deps-only range from producing a version. Keep it skipped -- but know
  # that it is the one skip with a live hole in it: a Dependabot group bump can
  # also widen a RUNTIME requirement (07b9b82 did, `thrift < 0.24` -> `< 0.25`),
  # and no rule here can tell that apart from a dev-dep bump. That case is
  # covered by the gemspec diff in docs/release-setup.md, not by this file.
  { message = "^chore", skip = true },
  { message = "^ci", skip = true },

  # NOT skipped, unlike the tooling types around it, and the reason is the trap this
  # rule exists to defuse: `build:` is the honest conventional type for a change
  # to a declared gem dependency, so picking the type CORRECTLY is what used to
  # lose the change. 94f85c8 added a runtime ceiling (`hexspace < 0.4`) under
  # `build(deps)` precisely rather than gaming it to `fix:` to clear the filter,
  # and the draft then said nothing about it. A rule of "remember to write
  # `fix:`" trades a true commit message for a visible changelog and will be got
  # wrong by whoever is in a hurry, so the config absorbs the cost instead.
  #
  # Grouped under "Changed" rather than a "Dependencies" heading of its own
  # because the headings here match CHANGELOG.md's existing four on purpose (see
  # the note above); a fifth would not paste in as part of the same file.
  #
  # Cost, measured rather than assumed: `^build` appears exactly ONCE in the
  # whole history (94f85c8, 2026-10-02) and that one occurrence is
  # consumer-visible, so the draft noise this admits is currently zero. It is
  # the same bargain the `^fix` note below spells out -- an internal `build:`
  # will draft an entry and justify a patch bump, and the human editing the
  # draft deletes it. Dependabot is unaffected: it writes `chore(deps)`, which
  # is still skipped, so a deps-only range still yields no version.
  #
  # Sits here, between ^ci and ^test, only because canon's list does (gator-doctor
  # compares the parser lists in order). First match wins, but no skip rule
  # above or below it matches a `build:` message, so the position changes nothing.
  { message = "^build", group = "Changed" },

  { message = "^test", skip = true },
  { message = "^style", skip = true },
  { message = "^docs", skip = true },
  { message = "^bd:", skip = true },

  { message = "^feat", group = "Added" },
  # Known over-inclusion, left as-is on purpose: this history has `fix(just)`,
  # `fix(ci)`, `fix(hooks)` and `fix(lint)` commits that touch nothing shipped,
  # and each of them will draft an entry and justify a patch bump. The
  # alternative -- an allowlist of non-shipping scopes -- goes stale silently and
  # fails the dangerous way, swallowing a real adapter fix. An extra patch
  # release is cheap; a missing one is not. This is one of the things the human
  # editing the draft is there to delete.
  { message = "^fix", group = "Fixed" },
  { message = "^perf", group = "Changed" },
  { message = "^refactor", group = "Changed" },
  { message = "^revert", group = "Changed" },

  # Deliberately not a silent skip: a conventional type nobody has classified
  # renders under its own heading rather than vanishing from the release.
  { message = ".*", group = "Uncategorized" },
]

# ORDINARY SemVer, because sequel-hexspace is past 1.0.0 -- 2.0.0 is published. A
# breaking change is a major bump, a feature a minor one. Both values are
# git-cliff's defaults and are spelled out only to stop the next person copying
# the sibling gems' configs wholesale: sequel-duckdb and sequelizer set BOTH of
# these to `false`, which is correct for them because they are 0.x, where the
# convention makes a breaking change a minor bump and a feature a patch. That is
# wrong for a 2.x gem.
#
# One measurement, recorded so the hazard is not overstated: on git-cliff 2.13.1
# with a current version of 2.0.0, these two settings are INERT -- flipping both
# to `false` still answers v3.0.0 for `feat!`, v2.1.0 for `feat` and v2.0.1 for
# `fix`. The likely reason is that the overrides only apply below 1.0.0, but that
# was NOT demonstrated: forcing a 0.x baseline here needs a 0.x tag, and with no
# matching tag git-cliff returns `initial_tag` outright instead of bumping from
# it, so there was no way to test it without fabricating a tag. Treat the
# mechanism as unverified and the measurement as the fact.
#
# So copying the siblings' 0.x block would not break the next release today. What
# it would do is encode a 0.x promise in a gem that has outgrown it, and arm
# itself the moment anything reuses this file or reads it as the house style --
# which is reason enough to state the intended values here rather than inherit
# them.
#
# This is the one table that deliberately differs from gator's canon, and canon
# says so itself: its header reserves the two `= false` lines for a 0.x gem and
# says a gem at 1.0 or above follows ordinary SemVer and leaves them out. (The
# doctor used to prescribe the 0.x rules to this gem; gator-n4a stopped it.)
# gator-doctor excludes [bump] from its canon comparison and only checks these
# keys against a 0.x version, so neither value raises a finding.
# Do not flip these to `false` to "match canon" -- inert at >= 1.0 or not, that
# encodes the 0.x promise this gem has outgrown.
[bump]
features_always_bump_minor = true
breaking_always_bump_major = true
