inherit_from: .rubocop_todo.yml

plugins:
  - rubocop-minitest

AllCops:
  # The OLDEST Ruby in ci.yml's matrix, not the newest and not the primary
  # target. This is what tells rubocop which syntax exists: set to 4.0 it
  # accepts 4.0-only syntax in a gem that still has to run on 3.3, and the
  # breakage shows up as a failing 3.3 test job or in a user's app instead of as
  # a lint offense. Raise it only when the matrix floor rises. If
  # required_ruby_version is ever declared in the gemspec, the
  # Gemspec/RequiredRubyVersion cop requires the two to agree, so they move
  # together.
  TargetRubyVersion: 3.3
  # Deliberately `disable`, not `enable`: with `enable`, a rubocop or plugin
  # bump switches its new cops on by itself and reds the build against code
  # nobody touched (rubocop-rspec 3.10.2 did exactly that to t_shank). New
  # cops are adopted on purpose, in a periodic cross-repo pass -- not never,
  # and not whenever Dependabot happens to fire. Decided 2026-09-12.
  NewCops: disable
  SuggestExtensions: false
  Exclude:
    - 'vendor/**/*'
    - 'bin/**/*'
    - 'tmp/**/*'
    # Scratch space for diagnostics, captured test output and throwaway debug
    # scripts. It is gitignored globally on this host, which is exactly why its
    # absence here was invisible: git never shows the files, and rubocop does
    # not read .gitignore, so the first sign of trouble is a red gate naming a
    # 9-line scratch script that nobody intended to ship. Anchored to the
    # directory name -- 'claude_stuff*' would also swallow a real file or
    # directory that merely starts with the same characters.
    - 'claude_stuff/**/*'

inherit_mode:
  merge:
    - Exclude

Layout/IndentationWidth:
  Width: 2

Style/StringLiterals:
  EnforcedStyle: single_quotes

Style/StringLiteralsInInterpolation:
  EnforcedStyle: double_quotes

Style/DefWithParentheses:
  Enabled: false

Style/MethodCallWithoutArgsParentheses:
  Enabled: true

Layout/LineLength:
  Max: 120
  AllowedPatterns: ['\A\s*#']
  Exclude:
    - '*.gemspec'
    - 'test/**/*'

Style/Documentation:
  Enabled: false

Style/FrozenStringLiteralComment:
  Enabled: false

Style/Lambda:
  Enabled: false

Style/ParallelAssignment:
  Enabled: false

Style/GuardClause:
  Enabled: true

Style/IfUnlessModifier:
  Enabled: true

Metrics/MethodLength:
  Max: 25

Metrics/ClassLength:
  Max: 200

Metrics/ModuleLength:
  Max: 200

Metrics/BlockLength:
  Max: 50
  Exclude:
    - 'test/**/*'
    - '*.gemspec'
    - 'Rakefile'

Style/ZeroLengthPredicate:
  Enabled: false

Naming/MemoizedInstanceVariableName:
  Enabled: false

Naming/MethodParameterName:
  MinNameLength: 1

Style/MultilineBlockChain:
  Enabled: false

Metrics/AbcSize:
  Max: 35
  Exclude:
    - 'test/**/*'

Metrics/CyclomaticComplexity:
  Max: 15

Metrics/PerceivedComplexity:
  Max: 12

Metrics/BlockNesting:
  Max: 4

Naming/AccessorMethodName:
  Enabled: false

Style/HashSyntax:
  EnforcedStyle: ruby19
  EnforcedShorthandSyntax: either

Minitest/AssertEqual:
  Enabled: true

Minitest/RefuteEqual:
  Enabled: true

Layout/EmptyLinesAroundClassBody:
  EnforcedStyle: empty_lines_except_namespace

Layout/EmptyLinesAroundModuleBody:
  EnforcedStyle: empty_lines_except_namespace

Style/TrailingCommaInArguments:
  EnforcedStyleForMultiline: comma

Style/TrailingCommaInArrayLiteral:
  EnforcedStyleForMultiline: comma

Style/TrailingCommaInHashLiteral:
  EnforcedStyleForMultiline: comma

Gemspec/DevelopmentDependencies:
  Enabled: false

Style/HashLikeCase:
  Exclude:
    - 'test/**/*'

Lint/DuplicateBranch:
  Exclude:
    - 'test/**/*'

Style/StringConcatenation:
  Exclude:
    - 'test/**/*'
