# Overcommit configuration for sequel-hexspace
# See https://github.com/sds/overcommit for documentation

PreCommit:
  RuboCop:
    enabled: true
    command: ['bundle', 'exec', 'rubocop']
    flags: ['--autocorrect']
    include:
      - '**/*.rb'
      - '**/*.rake'
      - '**/Rakefile'
      - '**/Gemfile'
      - '**/*.gemspec'

  # Tests disabled - requires live Spark database
  RakeTarget:
    enabled: false

  BundleAudit:
    enabled: false

  TrailingWhitespace:
    enabled: true
    exclude:
      - '**/*.md'

  MergeConflicts:
    enabled: true

  YamlSyntax:
    enabled: true

  JsonSyntax:
    enabled: true

  HardTabs:
    enabled: true
    exclude:
      - '**/Makefile*'
      - '**/*.mk'

CommitMsg:
  TextWidth:
    enabled: true
    max_subject_width: 60
    max_body_width: 72

PrePush:
  # The local CI gate, per the 2026-05-08 policy: this repo's GitHub Actions
  # minutes are billed, so run the local CI equivalent here rather than
  # discovering failures remotely. `just pre-push` is the contract — the
  # justfile decides what that means, and this file only says when it runs.
  #
  # It lives here rather than in .beads/hooks/pre-push because `habituate
  # install-hooks` owns core.hooksPath and points it at .git/hooks, where
  # overcommit's entrypoints sit; a gate under .beads/hooks would never run.
  #
  # Needs a reachable Spark Thrift server on :10000 — every test file connects
  # at load (test/spec_helper.rb), so there is no serverless subset. Development
  # happens on titan, which runs one. Bypass with --no-verify in emergencies only.
  LocalCiGate:
    enabled: true
    description: 'Run the local CI equivalent (just pre-push)'
    required_executable: 'just'
    # Wrapped in `sh -c` because overcommit appends git's own pre-push
    # arguments (the remote name and URL) to `command`; bare `just pre-push`
    # would read the first of them as a recipe name and fail with
    # "justfile does not contain recipe `origin`". Here they land in $0/$@ of
    # the shell and are ignored.
    command: ['sh', '-c', 'exec just pre-push']

PostCheckout:
  BundleCheck:
    enabled: true

PostMerge:
  BundleCheck:
    enabled: true

PostRewrite:
  BundleCheck:
    enabled: true
