version: 2

# cooldown (both entries below): Dependabot will not open a PR for a release
# until it is at least default-days old, so a version that is yanked or
# hotfixed inside its first week never reaches a PR at all. It says nothing
# about a release that was already established when the bump was proposed.
#
# The reason it is worth having here specifically: this repo auto-merges
# Dependabot PRs (dependabot-auto-merge.yml) without push CI, which is an
# accepted risk — the cooldown narrows what gets auto-merged to releases that
# have survived a week unretracted.
#
# Interaction with the monthly schedule, so a late bump is not misread as
# Dependabot being broken: a release younger than 7 days when Dependabot
# checks is skipped for that month and picked up at the NEXT monthly check.
# The worst-case delay is therefore roughly five weeks, not seven days. That
# is expected behaviour, not a defect.
updates:
  - package-ecosystem: bundler
    directory: "/"
    schedule:
      interval: monthly
    open-pull-requests-limit: 10
    cooldown:
      default-days: 7
    groups:
      minor-and-patch:
        update-types: ["minor", "patch"]
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: monthly
    open-pull-requests-limit: 10
    cooldown:
      default-days: 7
    groups:
      # `major` is here deliberately, and it does NOT defeat the auto-merge
      # gate. dependabot-auto-merge.yml allows only patch and minor, and
      # fetch-metadata reports a group's update-type as the MAX across every
      # dependency in it -- so a group containing a major reports semver-major
      # and waits for a human. Measured: the four grouped majors this repo has
      # seen (#11 #13 #19 #26) were all merged by hand, never by the bot.
      #
      # So keeping `major` means a major action bump gets PROPOSED and ruled on.
      # Dropping it would mean such a bump is never proposed and the pins
      # silently rot at whatever major they sit on, which is worse: a visible
      # PR awaiting review beats an invisible non-update.
      #
      # Note the bundler entry above is minor+patch only, so a major gem bump
      # arrives as its own ungrouped PR -- also refused by the same gate.
      # Rationale and evidence: docs/dependabot-auto-merge-gate.md.
      actions:
        update-types: ["minor", "patch", "major"]
