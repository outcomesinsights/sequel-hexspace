name: Dependabot auto-merge

# Stays `pull_request`, deliberately. `pull_request_target` would run this
# workflow's write token and the base repo's secrets against head-repo code,
# which is the standard way an auto-merge workflow becomes an arbitrary-write
# primitive. dependabot/fetch-metadata's README offers `pull_request_target` as
# its example because GitHub gives Dependabot-triggered `pull_request` runs a
# read-only token by default -- but this repo has the setting that grants them
# write access, and it works: the run on PR #39 (simplecov 1.2.0 -> 1.3.1)
# approved and auto-merged, landing 944ebd9. Do not "fix" the trigger.
on: pull_request

# Every action below is pinned to a full commit SHA with the version in a
# comment: a tag can be moved to other code, a SHA cannot, and this workflow
# holds the repo's broadest grants. Dependabot (github-actions ecosystem,
# monthly) proposes the bumps -- and note that this file is the thing that would
# auto-merge them.
#
# Deny by default: every scope the job below does not name is none. The grants
# live on the job rather than here, and are reasoned out there.
permissions: {}

jobs:
  dependabot:
    runs-on: ubuntu-latest

    # The author of the PR, not whoever triggered the run. `github.actor` is
    # spoofable for this purpose: it is the actor of THIS event, so a later
    # event on a Dependabot PR, or a re-run started by a person, presents a
    # different actor -- while the PR's author is fixed once the PR is opened
    # and cannot be changed. This is the only thing standing between a
    # non-Dependabot PR and the write scopes below, so it is worth the
    # precision. Flagged by zizmor's bot-conditions rule; the payload path is
    # the one dependabot/fetch-metadata's own README uses in every example, and
    # it was checked against this repo's real data: PR #39's `user.login` is
    # exactly `dependabot[bot]` and its `user` object has no `name` key at all,
    # so a slip to `.user.name` would evaluate to null, make this condition
    # false, and silently stop auto-merge with no error anywhere.
    if: github.event.pull_request.user.login == 'dependabot[bot]'

    # These are the repo's broadest grants and they are all load-bearing:
    #
    #   - `pull-requests: write` for `gh pr review --approve`. It also covers
    #     fetch-metadata, which only reads the PR (its README's minimal example
    #     asks for `pull-requests: read`).
    #   - `contents: write` for `gh pr merge --auto`. Enabling auto-merge is a
    #     repository write, not just a PR write, and GitHub requires both
    #     scopes together -- as does fetch-metadata's own auto-merge example.
    #
    # Drop either one and the job does not fail loudly; the `gh` call errors and
    # the PR simply sits unmerged. Nothing in this repo's gate catches a block
    # that is too narrow to function -- actionlint and zizmor were both probed
    # against exactly that defect and both stay silent. Read
    # docs/workflow-permissions.md before narrowing this, and add a scope here
    # rather than at the workflow level if you add a step.
    permissions:
      contents: write
      pull-requests: write

    steps:
      - name: Dependabot metadata
        id: metadata
        uses: dependabot/fetch-metadata@25dd0e34f4fe68f24cc83900b1fe3fe149efef98 # v3.1.0
        with:
          github-token: "${{ secrets.GITHUB_TOKEN }}"

      # THE UPDATE-TYPE GATE. An allowlist of patch and minor, so a MAJOR bump is
      # refused and waits for a human. It works, and it is measured rather than
      # read off the expression: across all 38 Dependabot PRs ever opened here,
      # the eight majors (#2 #3 #5 #11 #13 #19 #26 #29) were every one of them
      # merged by `aguynamedryan`, while all 20 bot merges were patch or minor.
      # Four of those majors were GROUP PRs and one was a group of two majors.
      #
      # Grouped PRs do not dodge this, which was the live worry: every
      # github-actions update arrives as a group whose `update-types` includes
      # major. fetch-metadata sets `update-type` from maxSemver() --
      # src/dependabot/output.ts at the pinned 25dd0e34, which reduces over EVERY
      # updated dependency and returns the first hit in the order [major, minor,
      # patch]. A group containing a major reports semver-major.
      #
      # THERE IS NO EMPTY-STRING ESCAPE HATCH ANY MORE, and do not re-add one.
      # d4e29b8 had appended `|| steps.metadata.outputs.update-type == ''` to
      # both conditions as "the update-type is empty for git ref (SHA) bumps".
      # That reason was false twice over: at d4e29b8^ not one action here was
      # SHA-pinned (all `@v1`/`@v5`/`@v6`/`@v7`) so no such bump existed to
      # observe -- and a SHA-ref bump carries a real update-type anyway, because
      # Dependabot resolves the pin to its release tag (sigstore/cosign PR
      # #5106, a SHA-pinned actions/setup-go major, emits
      # `update-type: version-update:semver-major`). The timing points at PR
      # #13, a grouped major the gate refused CORRECTLY and a human then merged
      # 16 minutes before d4e29b8 was authored. The clause never fired across
      # all 38 Dependabot PRs. Ryan ruled it deleted (bead 9ga, 2026-10-02), so
      # an update nobody can classify now waits for a human -- the same safe
      # failure every major already gets. Do not re-justify it with the
      # SHA-bump story.
      #
      # STILL OPEN, and deleting that clause did NOT close it: maxSemver
      # IGNORES an unclassifiable entry rather than failing closed, so a group
      # pairing an unclassifiable dependency with a classified patch reports
      # `patch` and is admitted by the ALLOWLIST. Nothing observed does it.
      #
      # Keep this condition IDENTICAL to the one on `Enable auto-merge` below.
      # Approving on terms the merge step does not share leaves an approved PR
      # sitting; the reverse merges something nobody approved. The probe asserts
      # they match.
      #
      # Full evidence, the decisions, and what remains unproven:
      # docs/dependabot-auto-merge-gate.md. Re-measure with
      # ./docs/dependabot-gate-probe.sh.
      - name: Approve PR
        if: >-
          contains(fromJSON('["version-update:semver-patch", "version-update:semver-minor"]'),
          steps.metadata.outputs.update-type)
        run: gh pr review --approve "$PR_URL"
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Must stay byte-identical to the `Approve PR` condition above, where the
      # gate is explained. Enabling auto-merge is the step that actually lands
      # the commit, so if the two ever diverge this is the half that matters.
      - name: Enable auto-merge
        if: >-
          contains(fromJSON('["version-update:semver-patch", "version-update:semver-minor"]'),
          steps.metadata.outputs.update-type)
        run: gh pr merge --auto --squash "$PR_URL"
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
