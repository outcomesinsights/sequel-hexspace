name: Dependabot auto-merge

on: pull_request

# An explicit permissions block sets every scope it does not name to none, and
# no linter in this repo catches one that is too narrow to function -- see
# docs/workflow-permissions.md before narrowing this or moving it per-job. These
# are the repo's broadest grants, so this is where that mistake costs most.
permissions:
  contents: write
  pull-requests: write

jobs:
  dependabot:
    runs-on: ubuntu-latest
    if: github.actor == 'dependabot[bot]'
    steps:
      - name: Dependabot metadata
        id: metadata
        uses: dependabot/fetch-metadata@v3
        with:
          github-token: "${{ secrets.GITHUB_TOKEN }}"

      - name: Approve PR
        if: >-
          contains(fromJSON('["version-update:semver-patch", "version-update:semver-minor"]'),
          steps.metadata.outputs.update-type)
          || steps.metadata.outputs.update-type == ''
        run: gh pr review --approve "$PR_URL"
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Enable auto-merge
        if: >-
          contains(fromJSON('["version-update:semver-patch", "version-update:semver-minor"]'),
          steps.metadata.outputs.update-type)
          || steps.metadata.outputs.update-type == ''
        run: gh pr merge --auto --squash "$PR_URL"
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
