name: CI

# Pushing to a branch with an open PR fires BOTH `push` and `pull_request`, so a
# bare `on: [push, pull_request]` ran the whole matrix twice per push and a third
# time on merge. Limiting `push` to main leaves one run per PR push and one on
# merge. Coverage is unchanged; only the duplicate goes away. The concurrency
# group below does not help here — push and pull_request are different refs.
#
# Every action below is pinned to a full commit SHA with the version in a
# comment: a tag can be moved to other code, a SHA cannot. Dependabot
# (github-actions ecosystem, monthly) proposes the bumps, which is the intended
# way these move. release.yml says the same thing about its own pins.
on:
  push:
    branches: [main]
    # Skip the matrix for a commit that changes nothing this workflow can test.
    # Measured on this tree 2026-10-02: 16 of the last 64 non-merge commits on
    # main touched ONLY the paths below, and each one paid a full run -- a
    # ~400MB Spark download, a thriftserver, and a 305-test suite across three
    # Rubies, 9-11 minutes.
    #
    # On `push` ONLY, deliberately -- NOT on `pull_request` below. `main`'s
    # branch protection requires the status check context `ci` (read from the
    # live API 2026-10-02: required_status_checks.contexts == ["ci"]). A skipped
    # workflow reports NO check at all rather than a passing one, so a
    # markdown-only PR would sit permanently unmergeable with nothing to
    # re-run, and dependabot-auto-merge.yml's `gh pr merge --auto` would wait
    # on a check that never arrives. A skipped push is recoverable by pushing
    # anything else; a skipped pull_request is not. That is also why the three
    # entries sit here under `push:` and not at the top level of `on:`.
    #
    # That same protection does not block the push itself, so there is no
    # symmetric hazard on this side: a required check cannot be evaluated
    # against a commit the remote does not have yet, which is why a push to
    # main is permitted and the check runs afterwards.
    #
    # SCOPE OF THE SAVING, per GitHub's documented `before...after` comparison
    # for a push -- taken from their documentation, NOT measured here, because a
    # paths filter's behaviour is only observable on a real push and this file
    # has never been on a pushed commit: the filter is evaluated over the whole
    # pushed RANGE, not per commit. A batch push that mixes markdown commits
    # with one lib/
    # commit still runs once, at the tip; only a push whose entire range is
    # ignorable is skipped. The 16-of-64 figure above counts commits and is
    # therefore an upper bound on runs saved. This cuts the other way too, and
    # usefully: the tip of a mixed batch push gets a run at its own SHA even
    # when the tip commit itself is markdown-only, which is exactly the SHA a
    # release would tag.
    #
    # KNOWN INTERACTION, chosen rather than discovered: a commit matched here
    # produces no ci.yml run at all, and release.yml's `verify` job requires a
    # successful ci.yml run with event=push, branch=main, at the exact tagged
    # SHA. So such a commit can never be released -- `verify` reports
    # "missing" and refuses, with a message that reads like a CI failure. That
    # is accepted: nothing untested should ship, the version-bump commit a
    # release actually tags is a gemspec change that no entry here ignores, and
    # the class already exists without this filter (origin/main's tip 944ebd9
    # is a Dependabot auto-merge squash with zero runs of any kind, because a
    # GITHUB_TOKEN-driven merge triggers no workflow). docs/release-setup.md's
    # "Cutting a release" step 5 is where that is written down for a releaser.
    #
    # Each entry, and why two of gator-doctor's suggestions are absent:
    #   - '.seeds/**', '.beads/**': deliberation and task tracking. Nothing in
    #     lib/ or test/ reads either. `.beads/hooks/*` are shell scripts, but
    #     they are local git hooks that no step in this workflow runs.
    #   - '**.md': the `lint` job runs `bundle exec rubocop`, which reads no
    #     markdown, and the `test` job runs `test/all.rb`, which reads none
    #     either -- test/ names the README only inside prose comments. mdformat
    #     and actionlint are LOCAL gates (`just fmt-check`, `just hygiene`) and
    #     are not steps here, so ignoring markdown costs this workflow no
    #     coverage it has. Note it does not match `README`, which has no
    #     extension; nor would that matter, since the only check that reads the
    #     gemspec's packaging allowlist lives in release.yml.
    #   - NOT 'docs/**': docs/ holds permissions-gate-probe.sh and
    #     ci-gate-probe.sh, both of which are code.
    #     '**.md' already covers both of its markdown pages.
    #   - NOT '.claude/**' or 'claude_stuff/**': both are gitignored in this
    #     repo, so neither can appear in a commit here and both entries would
    #     be dead text that reads as coverage.
    paths-ignore:
      - ".seeds/**"
      - ".beads/**"
      - "**.md"
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Deny by default: every scope a job does not name is none, so all three jobs
# below declare their own block and each one is reasoned out in a comment there.
# An explicit block REPLACES the default grant rather than adding to it --
# including the `contents: read` that `actions/checkout` cannot work without --
# and nothing in this repo's gate will tell you what a block revoked: actionlint
# and zizmor were both probed against exactly that defect and both stay silent.
# Read docs/workflow-permissions.md before editing any block below, or before
# adding a step to any of these jobs.
permissions: {}

jobs:
  lint:
    runs-on: ubuntu-latest

    # `contents: read` is for the checkout, and is the whole of it. Nothing else
    # in this job spends the GITHUB_TOKEN's repo scopes:
    #
    #   - `ruby/setup-ruby` passes `github.token` on its `token` input to
    #     download Ruby release assets from the public ruby/ruby-builder repo. A
    #     `permissions:` block governs this repo only, so no scope here enables
    #     or disables that.
    #   - `bundler-cache: true` drives the Actions cache service, which is
    #     authenticated by the runner's own ACTIONS_RUNTIME_TOKEN and not by the
    #     GITHUB_TOKEN; actions/cache's action.yml takes no token input at all.
    #   - `bundle exec rubocop` touches no API.
    #
    # Measured in this repo rather than assumed: the v2.0.0 release ran
    # `ruby/setup-ruby` with `bundler-cache: true` under an explicit
    # `contents: write` + `id-token: write` block -- no `actions:` scope, no
    # other scope -- and published successfully.
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Nothing in this job pushes, so the checkout's credentials have no
          # job to do; left in the local git config they can leak out through a
          # build step or an uploaded artifact (zizmor's artipacked).
          persist-credentials: false
      - uses: ruby/setup-ruby@14594264cd68ce8a2345dd349bc3d138a4ef85c8 # v1.327.0
        with:
          ruby-version: "4.0"
          bundler-cache: true
      - name: Run RuboCop
        run: bundle exec rubocop

  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        ruby: ["3.3", "3.4", "4.0"]
    name: Test Ruby ${{ matrix.ruby }}

    # `contents: read` is for the checkout, and again is the whole of it. Beyond
    # the setup-ruby and cache reasoning on the `lint` job above, this job adds
    # two steps and neither needs a scope:
    #
    #   - `actions/cache` for the Spark download: same cache service, same
    #     runtime token, no token input on the action.
    #   - `actions/upload-artifact` for coverage: its action.yml at v7.0.1
    #     declares no `github-token` input, because it talks to the artifact
    #     service with the runner's ACTIONS_RUNTIME_TOKEN. Do not add
    #     `actions: read` for it -- that is what `actions/download-artifact`
    #     needs to reach ANOTHER run's artifacts via its `run-id` and
    #     `github-token` inputs, which nothing here does.
    #
    # The Spark tarball comes from archive.apache.org and `bundle install` from
    # rubygems.org; the Gemfile has no git sources. No step in this job calls
    # the GitHub API.
    permissions:
      contents: read

    env:
      SPARK_VERSION: 3.5.0
      # Test jobs have no business installing linters. This started as a
      # workaround -- parallel's Ruby floor sat above the matrix's old 3.2 --
      # and with 3.2 dropped it is now a deliberate exclusion. Keep it: parallel
      # requires >= 3.3, exactly this matrix's floor, so there is no headroom and
      # a parallel bump would break `bundle install` on 3.3 if the group were
      # included. An excluded group escapes bundler's ruby-version check.
      BUNDLE_WITHOUT: lint
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # This job uploads an artifact, which is the exact path by which a
          # persisted credential escapes the runner. Nothing here pushes.
          persist-credentials: false
      - uses: ruby/setup-ruby@14594264cd68ce8a2345dd349bc3d138a4ef85c8 # v1.327.0
        with:
          ruby-version: ${{ matrix.ruby }}
          # Stays deliberately. zizmor's cache-poisoning rule is about a job on
          # a RELEASE trigger restoring a cache that a branch or PR run wrote;
          # this workflow runs on push-to-main and pull_request, so it WRITES
          # those caches rather than consuming one across a trust boundary.
          # release.yml's publishing job is the one that sets this to false.
          bundler-cache: true

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/spark
          key: spark-${{ env.SPARK_VERSION }}
        id: cache-spark
      - name: Download Spark
        if: steps.cache-spark.outputs.cache-hit != 'true'
        run: |
          wget -q "https://archive.apache.org/dist/spark/spark-$SPARK_VERSION/spark-$SPARK_VERSION-bin-hadoop3.tgz"
          tar xzf "spark-$SPARK_VERSION-bin-hadoop3.tgz"
          mv "spark-$SPARK_VERSION-bin-hadoop3" ~/spark

      - run: ~/spark/sbin/start-thriftserver.sh && sleep 20
      - run: bundle exec rake test
        env:
          SEQUEL_INTEGRATION_URL: "hexspace:///"
          RUNNING_IN_CI: "1"
      - name: Upload Coverage
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage-ruby-${{ matrix.ruby }}
          path: coverage/
          retention-days: 90

  ci:
    if: always()
    needs: [lint, test]
    runs-on: ubuntu-latest

    # Genuinely nothing. The single step below is a shell script over the
    # `needs` context, which the expression evaluator resolves from the run's
    # own state before the step starts -- no checkout, no API call, no token,
    # and jq is a local binary on the runner image.
    # This is the one job here that needs no scope at all, and saying so
    # explicitly is the point: it inherits `{}` from the workflow either way,
    # but a reader adding a step to this job should see that the block was a
    # decision and not an oversight.
    permissions: {}

    steps:
      # A POSITIVE ASSERTION -- every needed job's result must BE `success` --
      # replacing the blocklist that used to live here. That blocklist tested for
      # 'failure' and 'cancelled' and nothing else, so a SKIPPED needed job left
      # this job printing "All CI jobs passed" and exiting 0. Why that mattered
      # more than the code suggests: `main`'s branch protection requires exactly
      # one status check context, `ci` (read from the live API 2026-10-02:
      # required_status_checks.contexts == ["ci"]), and release.yml's `verify`
      # job treats a successful ci.yml run at the tagged SHA as evidence that the
      # commit was tested. Both of them read this job's conclusion and nothing
      # else, so a green `ci` over a job that never ran satisfied the only gate
      # on merging AND the gate on publishing.
      #
      # ALL FOUR values GitHub documents for a needed job's `result`, and what
      # each one does here:
      #
      #   success    PASSES. The only value that does.
      #   failure    fails. A job ran and reported a problem.
      #   cancelled  fails. The run was cancelled -- by the `concurrency` group
      #              above, by a person, or by a timeout -- so the suite did not
      #              finish and nothing is known about the commit.
      #   skipped    fails, and that is the change here. A job is skipped when
      #              its own `if:` is false, when a job it `needs:` did not
      #              succeed, or when its matrix expands to nothing. NEITHER
      #              `lint` NOR `test` CAN BE SKIPPED TODAY -- neither has an
      #              `if:`, neither has `needs:`, and the matrix is three literal
      #              entries -- so this costs nothing now and closes the hole the
      #              moment someone adds a condition to either. There is no
      #              legitimate skip to accommodate: a push this workflow should
      #              not test is handled by `paths-ignore` above, which produces
      #              NO RUN AT ALL rather than a run with a skipped job inside
      #              it, and release.yml refuses that correctly as "missing".
      #
      # Written positively ON PURPOSE, and not as a blocklist with 'skipped'
      # added to the pair. A blocklist is right about the values its author
      # thought of and silently wrong about every other one, which is exactly how
      # the defect above was born; enumerating four values is no protection
      # against a fifth that GitHub may document later, or against the empty
      # string a context can yield when something about the run is unusual.
      # `!= success` fails closed on anything unanticipated.
      #
      # The one fail-open mode a positive assertion has of its own is the EMPTY
      # SET: "every needed job succeeded" is vacuously TRUE when there are no
      # needed jobs. So the guarded set is asserted BY NAME first, and
      # EXPECTED_JOBS has to be edited together with `needs:` above. Dropping a
      # job from `needs:` and forgetting this list turns the gate red, which is
      # the direction a mistake here has to fail.
      #
      # Re-probe with ./docs/ci-gate-probe.sh, which extracts the `run:` block
      # below WITH A YAML PARSER and runs it over all four documented results
      # plus the degenerate shapes. Its header says what that does and does not
      # prove: the shell logic, yes; GitHub's own evaluation of `toJSON(needs)`,
      # no -- this workflow has never run on GitHub from this tree.
      - name: Check CI status
        env:
          # Read through the environment rather than interpolated into the script
          # body. These values are GitHub's own and are not attacker-shaped, but
          # a `${{ }}` inside a `run:` block is a textual substitution into
          # source code, and nothing else in this repo's workflows writes that
          # shape. `toJSON(needs)` rather than `needs.*.result` because it
          # carries the job NAMES, which both checks below report on.
          #
          # jq is preinstalled on GitHub's ubuntu-latest image. If it ever is
          # not, `set -e` turns a missing jq into a failed gate rather than a
          # passing one.
          NEEDS_JSON: ${{ toJSON(needs) }}
          # Must list exactly the jobs named in `needs:` above.
          EXPECTED_JOBS: '["lint", "test"]'
        run: |
          set -euo pipefail

          echo "Needed jobs and their results:"
          jq -r 'to_entries | sort_by(.key)[] | "  \(.key) = \(.value.result)"' <<<"$NEEDS_JSON"

          guarded=$(jq -r 'keys | join(", ")' <<<"$NEEDS_JSON")
          expected=$(jq -r 'sort | join(", ")' <<<"$EXPECTED_JOBS")
          if [[ "$guarded" != "$expected" ]]; then
            echo "::error::This gate is written to guard [$expected], but needs: resolved to [$guarded]. Branch protection requires only this job, so any job missing from needs: is gated by nothing. Update needs: and EXPECTED_JOBS together."
            exit 1
          fi

          not_green=$(jq -r 'to_entries | map(select(.value.result != "success")) | sort_by(.key) | map("\(.key)=\(.value.result)") | join(", ")' <<<"$NEEDS_JSON")
          if [[ -n "$not_green" ]]; then
            echo "::error::CI is not green: $not_green. Only 'success' passes this gate -- failure, cancelled and skipped all fail it."
            exit 1
          fi

          echo "All CI jobs passed"
