name: Release

# Trusted Publishing: this workflow is registered as sequel-hexspace's trusted
# publisher on rubygems.org (owner outcomesinsights, repo sequel-hexspace,
# workflow release.yml, environment release), so it mints a short-lived,
# push-scoped token via GitHub's OIDC provider at run time. There is no
# RUBYGEMS_API_KEY secret in this repo and there must never be one — the point of
# the arrangement is that no long-lived credential exists to leak, rotate, or tie
# the gem to one person's machine.
#
# To cut a release: bump s.version in the gemspec, land it on main, wait for CI
# to go green, then push a matching tag (`git tag v1.0.2 && git push origin
# v1.0.2`). Anyone with write access to the repo can do that; being a gem owner
# on rubygems.org is not required.
on:
  push:
    tags:
      - "v*"

jobs:
  # ci.yml runs on pushes to main and on PRs — never on a tag. Without this job a
  # tag pointing at an untested commit would publish an unbuilt, untested gem,
  # and a yank is the only way back out. So require that the exact commit being
  # tagged already has a successful CI run of its own.
  #
  # This blocks a tag pushed in the same breath as the commit, while CI is still
  # running. That is the intended behaviour, not a bug: re-run this workflow once
  # CI finishes. It fails closed — an API hiccup blocks the release rather than
  # waving it through.
  #
  # It also asserts the tag names the version the gemspec will actually build.
  # Nothing else ties the two together: the trigger matches any `v*` tag and
  # release-gem builds whatever s.version says, so tagging v2.1.0 against a
  # gemspec reading 2.0.0 would publish 2.0.0 under a v2.1.0 tag. That is
  # currently refused only by accident, as a confusing detached-HEAD push failure
  # downstream, which is not a check.
  verify:
    runs-on: ubuntu-latest

    # An explicit permissions block sets every scope it does not name to none,
    # so `contents: read` has to be spelled out or the checkout below cannot
    # fetch the repo. `actions: read` is for the gh api call.
    permissions:
      actions: read
      contents: read
    steps:
      # Needed only so the gemspec is on disk for the version assertion below.
      # No credentials: this job pushes nothing.
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      # The runner's preinstalled ruby is enough — this gemspec is plain Ruby
      # with no requires and no version file, so loading it needs nothing but
      # RubyGems. No setup-ruby step, and no bundle.
      - name: Require the tag to match the gemspec version
        env:
          REF_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          tag_version="${REF_NAME#v}"
          gemspec_version=$(ruby -e 'print Gem::Specification.load("sequel-hexspace.gemspec").version.to_s')
          echo "Tag version: $tag_version"
          echo "Gemspec version: $gemspec_version"
          if [[ "$tag_version" != "$gemspec_version" ]]; then
            echo "::error::Tag $REF_NAME means version $tag_version, but the gemspec at this commit says $gemspec_version. Bump s.version to match, or delete the tag and re-tag the right commit."
            exit 1
          fi

      - name: Require a green CI run for this commit
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ github.sha }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          count=$(gh api \
            "repos/$REPO/actions/workflows/ci.yml/runs?head_sha=$SHA&status=success" \
            --jq '.total_count')
          echo "Successful CI runs for $SHA: $count"
          if [[ "$count" -lt 1 ]]; then
            echo "::error::No successful CI run for $SHA. Land the commit on main, let CI pass, then re-run this workflow."
            exit 1
          fi

  push:
    needs: [verify]
    runs-on: ubuntu-latest

    # Required by the OIDC token exchange. Scoped to this job rather than the
    # workflow, per RubyGems' guidance.
    permissions:
      contents: write
      id-token: write

    # Must match the environment registered with the trusted publisher, or the
    # token exchange is refused. It also gives the repo a place to hang a
    # required reviewer on releases without touching this file.
    environment: release

    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '4.0'
          bundler-cache: true

      # Builds from the Rakefile's bundler/gem_tasks and pushes with the
      # short-lived token. No credentials are passed in.
      - uses: rubygems/release-gem@v1
